name: Crawl websites

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Internet Archive CLI
        run: python -m pip install internetarchive

      - name: Run crawler
        run: node run.js

      - name: Configure Internet Archive CLI
        if: always()
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          mkdir -p "$HOME/.config/internetarchive"
          umask 077
          printf '[s3]\naccess = %s\nsecret = %s\n' \
            "$IA_ACCESS_KEY" "$IA_SECRET_KEY" \
            > "$HOME/.config/internetarchive/ia.ini"

      - name: Upload crawl output to Internet Archive
        if: always()
        run: |
          ia upload "mycrawl-run-${{ github.run_id }}" output/ \
            --metadata="title:My Crawl Run ${{ github.run_id }}" \
            --metadata="mediatype:data"

      - name: Upload crawl output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mycrawl-output-${{ github.run_id }}
          path: output/
          if-no-files-found: warn
          retention-days: 25
